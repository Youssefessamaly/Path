spring:
  application:
    name: intern-platform-backend

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:intern_platform}
    username: ${POSTGRES_USER:intern_platform}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Local development uses Mailpit (in infrastructure/docker-compose.yml).
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: false

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

app:
  password-reset:
    # Mailpit accepts this development-only sender. Production overrides it.
    from-address: ${SMTP_FROM:no-reply@path.local}
  support:
    # Where a public support-form submission (legal-web/support.html) is delivered.
    # Correct out of the box in every environment; override only if PATH's support inbox
    # ever changes.
    notification-email: ${SUPPORT_NOTIFICATION_EMAIL:path.app.support@gmail.com}
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 3600
  admin:
    # Optional one-time ADMIN account provisioning — see AdminAccountBootstrapper. Left unset
    # by default (empty = no-op); set both to provision the first internal admin account, then
    # they may be safely left in place (an existing admin is never recreated/reset).
    bootstrap-email: ${PATHORA_ADMIN_EMAIL:}
    bootstrap-password: ${PATHORA_ADMIN_PASSWORD:}
  ai:
    # Provider-independent AI scaffolding (Stage 5A — see com.internplatform.screening.ai).
    # "disabled" (the default) means no model, no network call, nothing sent anywhere.
    # "anthropic" (Stage 5B) selects the real Anthropic-backed implementations — see
    # com.internplatform.screening.ai.anthropic. Never change either mode in a real
    # environment without separate, explicit approval; real applicant CVs must never reach
    # the provider without that approval (see Phase D of the Stage 5B plan).
    evidence-analysis:
      mode: ${AI_EVIDENCE_ANALYSIS_MODE:disabled}
      # SEPARATE from mode above: even with mode=anthropic, AnthropicEvidenceAnalysisService
      # refuses to run unless this is also explicitly true. This is the business-side gate —
      # it must only be flipped once the applicable privacy notice, disclosure/consent, and
      # lawful-processing prerequisites for sending real applicant CV content to Anthropic
      # have actually been confirmed (Phase D). Never default this to true; never infer
      # consent. Does not affect rubric drafting, which never contains applicant data.
      privacy-review-passed: ${AI_EVIDENCE_ANALYSIS_PRIVACY_REVIEW_PASSED:false}
    rubric-draft:
      mode: ${AI_RUBRIC_DRAFT_MODE:disabled}
    provider:
      # Secret — backend environment variable or approved secrets manager only. Never
      # committed, never logged, never exposed through any frontend config (React/Expo).
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_API_BASE_URL:https://api.anthropic.com}
      api-version: ${ANTHROPIC_API_VERSION:2023-06-01}
      model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
      timeout-ms: ${AI_PROVIDER_TIMEOUT_MS:8000}
      max-retries: ${AI_PROVIDER_MAX_RETRIES:1}
      max-output-tokens: ${AI_PROVIDER_MAX_OUTPUT_TOKENS:1024}
      # Per-company abuse/cost cap, independent of whatever limit Anthropic itself enforces.
      # In-memory only (see AiRateLimiter) — resets on restart; a durable quota would need a
      # new table, deliberately not added in this increment.
      daily-call-limit-per-company: ${AI_PROVIDER_DAILY_LIMIT:50}